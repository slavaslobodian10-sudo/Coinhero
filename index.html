<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a6670">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Монетный герой</title>
<style>
:root{box-sizing:border-box;--bg:#19b9aa;--ink:#06302d;--panel:#fffaf0;--line:#0d7d77;--btn:#0a4d57;--btnink:#fff;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b8f8a;--ink:#f1ffff;--panel:#17292700;--line:#0a5f5a;--btn:#e8b53a;--btnink:#1a1a10;color-scheme:dark}}
*{box-sizing:border-box}
html,body{overflow:hidden;height:100%;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;background:linear-gradient(160deg,var(--bg),#0a6670) fixed;min-height:100%;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}
main{position:fixed;inset:0;display:flex;flex-direction:column;gap:6px;padding:max(6px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
h1{font-size:20px;margin:4px 0 8px}
canvas{width:100%;flex:1;min-height:0;display:block;border-radius:10px;border:3px solid var(--line);box-shadow:0 8px 30px rgba(0,50,55,.5);touch-action:none;background:#14302f}
#shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{font:inherit;font-weight:700;padding:12px 8px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink);cursor:pointer;text-align:left;line-height:1.25}
button small{display:block;font-weight:400;opacity:.85}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#boss{grid-column:1/-1;background:#c4402f;color:#fff;text-align:center}
p{font-size:13px;opacity:.8;margin:8px 0 0}
#mb{grid-column:1/-1;text-align:center}
#bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
#padwrap{width:140px;flex:none}
#acts{display:flex;flex-direction:column;gap:6px;flex:1;max-width:220px}
#acts button{text-align:center}
#shopm .box{width:min(94vw,440px);display:flex;flex-direction:column;gap:8px;margin:auto;color:#f1ead2}
#shopm h2{margin:0;text-align:center;font-size:22px}
#shopm>.box>button{background:#e8b53a;color:#1a1a10;padding:11px;text-align:center}
#shopm #shop{margin-top:0}
#shopm #shop button{background:#e8b53a;color:#1a1a10}
#shopm #shop #boss{background:#c4402f;color:#fff}
#pad{position:relative;width:140px;height:140px;margin:0 auto;border-radius:50%;background:rgba(127,127,127,.18);border:3px solid var(--line);touch-action:none;flex:none}
#knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--btn);pointer-events:none}
#menu,#set,#shopm{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(4,40,42,.94);overflow:auto;padding:12px}
#set{display:none;z-index:6}
#shopm{display:none;z-index:4}
#menu .box,#set .box{width:min(92vw,400px);display:flex;flex-direction:column;gap:8px;color:#f1ead2}
#menu h2,#set h2{margin:0;text-align:center;font-size:24px}
#menu p{text-align:center;margin:0 0 4px;color:#f1ead2;opacity:1}
#menu button,#set button{background:#e8b53a;color:#1a1a10;padding:11px 12px}
#set label{display:block;font-size:15px;text-align:center;margin:6px 0}
#set input{width:100%;margin:8px 0 2px;accent-color:#e8b53a}
#set small{display:block;opacity:.75;font-size:12px;font-weight:400}
#set button{text-align:center}
#menu .box,#set .box{margin:auto}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dg button:last-child{grid-column:1/-1;text-align:center}
.lv{display:flex;align-items:center;justify-content:center;gap:12px;font-size:15px}
.lv button{width:42px;padding:6px;text-align:center}
.lv b{min-width:26px;text-align:center;font-size:20px}
@media (orientation:landscape) and (max-height:700px){
#bar{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:10px;pointer-events:none;align-items:flex-end}
#bar>*{pointer-events:auto}
#acts{width:130px;flex:none}
#acts button{opacity:.92}
button{padding:7px 8px;font-size:13px}
#pad{margin:0 auto;width:120px;height:120px}
#padwrap{width:120px;opacity:.85}
#knob{width:50px;height:50px;margin:-25px 0 0 -25px}
}
</style>
</head>
<body>
<main>
<canvas id="c" width="640" height="400"></canvas>
<div id="bar"><div id="padwrap"><div id="pad"><div id="knob"></div></div></div>
<div id="acts"><button onclick="openShop()">🛒 Магазин</button><button onclick="openSet()">⚙ Настройки</button><button onclick="goMenu()">☰ Меню</button></div></div>
<div id="shopm"><div class="box"><h2>Магазин</h2><div id="shop"></div><button onclick="closeShop()">Играть</button></div></div>
<div id="menu"><div class="box"><h2>Монетный герой</h2><p id="mt">Выбери сложность</p>
<div class="lv">Стартовый уровень <button onclick="lvS(-1)">−</button><b id="sl">1</b><button onclick="lvS(1)">+</button></div>
<p style="font-size:12px;opacity:.7">За каждый уровень выше первого даётся 80 стартовых монет</p>
<div class="dg"><button onclick="start(0)">1 · Лёгкий<small>Враги слабее, монет больше</small></button>
<button onclick="start(1)">2 · Средний<small>Обычная игра</small></button>
<button onclick="start(2)">3 · Тяжёлый<small>Враги сильнее, монет меньше</small></button>
<button onclick="start(3)">4 · Кошмар<small>Враги намного сильнее</small></button>
<button onclick="start(4)">5 · Ад<small>Почти невозможно</small></button></div>
<button onclick="openSet()" style="background:transparent;color:#f1ead2;border:2px solid #f1ead2;text-align:center">⚙ Настройки</button></div></div>
<div id="set"><div class="box"><h2>Настройки</h2>
<label>Чувствительность джойстика: <b id="sv">1.0</b><input id="sr" type="range" min="0.5" max="2" step="0.1" value="1"><small>Больше — герой быстрее реагирует</small></label>
<label>Размер игры: <b id="zv">100%</b><input id="zr" type="range" min="0.6" max="1.4" step="0.1" value="1"><small>Отдельно для горизонтального и вертикального экрана. Меньше — видно больше поля</small></label>
<button onclick="fs()">⛶ Полный экран</button>
<button id="t_q" onclick="cq()"></button>
<button id="t_dmg" onclick="tg('dmg')"></button>
<button id="t_snd" onclick="tg('snd')"></button>
<button id="t_vib" onclick="tg('vib')"></button>
<button onclick="closeSet()" style="text-align:center">Готово</button></div></div>
</main>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=640,H=400;
const WP=[{n:'Палка',d:3,r:70,cd:.5,p:0,c:0},{n:'Меч',d:7,r:85,cd:.35,p:0,c:40},{n:'Лук',d:9,r:230,cd:.45,p:1,c:110},{n:'Посох',d:20,r:260,cd:.55,p:1,c:260},{n:'Пулемёт',d:8,r:250,cd:.09,p:1,c:600}];
let up={spd:0,hp:0,dmg:0},wi=0,money=0,bossLv=1,P,coins=[],en=[],bl=[],eb=[],boss=null,keys={},joy=null,flash=0,msg='',msgT=0,tc=0,ts=0,lastKey='',bt=120,dead=0,idle=0;
const maxHp=()=>50+up.hp*20, spd=()=>120+up.spd*14, dm=()=>(1+up.dmg*.25)*(x2?2:1);
const cost=k=>Math.round(30*Math.pow(1.4,up[k]));
function reset(){P={x:W/2,y:H/2,hp:maxHp(),inv:0,cd:0,a:0};en=[];eb=[];bl=[];boss=null;bt=120;idle=0}
function say(s){msg=s;msgT=2.5}
reset();
addEventListener('keydown',e=>{keys[e.code]=1;if(paused&&/^Digit[1-5]$/.test(e.code))start(+e.code[5]-1);if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{keys={}});
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
let SENS=1;
const sr=document.getElementById('sr'),sv=document.getElementById('sv');
try{const s=parseFloat(localStorage.getItem('sens'));if(s>=.5&&s<=2){SENS=s;sr.value=s;sv.textContent=s.toFixed(1)}}catch(e){}
sr.addEventListener('input',()=>{SENS=parseFloat(sr.value);sv.textContent=SENS.toFixed(1);try{localStorage.setItem('sens',SENS)}catch(e){}});
let Zs={p:1,l:.6},ZN=[],resume=false;const isL=()=>matchMedia('(orientation:landscape) and (max-height:700px)').matches,curZ=()=>Zs[isL()?'l':'p'];
const zr=document.getElementById('zr'),zv=document.getElementById('zv'),sett=document.getElementById('set');
try{const z=JSON.parse(localStorage.getItem('zoom2')||'{}');if(z.p>=.6&&z.p<=1.4)Zs.p=z.p;if(z.l>=.6&&z.l<=1.4)Zs.l=z.l}catch(e){}
function syncZ(){zr.value=curZ();zv.textContent=Math.round(curZ()*100)+'%'}syncZ();
zr.addEventListener('input',()=>{Zs[isL()?'l':'p']=parseFloat(zr.value);syncZ();try{localStorage.setItem('zoom2',JSON.stringify(Zs))}catch(e){}fit()});
function openSet(){resume=!paused;paused=true;sett.style.display='flex'}
function closeSet(){sett.style.display='none';if(resume)paused=false;resume=false}
function zin(o,i){const z=ZN[i];return !!z&&Math.hypot(o.x-z.x,o.y-z.y)<z.r}
let sres=false;const shopm=document.getElementById('shopm');
function openShop(){sres=!paused;paused=true;shopm.style.display='flex'}
function closeShop(){shopm.style.display='none';if(sres)paused=false;sres=false}
function goMenu(){paused=true;menu.style.display='flex'}
function fs(){try{const e=document.documentElement;const p=document.fullscreenElement?document.exitFullscreen():e.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}catch(x){}}
function fit(){const r=cv.getBoundingClientRect();if(r.width<50||r.height<50)return;syncZ();const s=.85*curZ();W=Math.round(r.width/s);H=Math.round(r.height/s);cv.width=W;cv.height=H;const q=Math.min(W,H)*.15;
 ZN=[{x:W*.16,y:H*.74,r:q,c:'rgba(80,200,120,.22)',s:'#7be0a0',n:'💚',t:'Лечение'},{x:W*.8,y:H*.26,r:q,c:'rgba(232,181,58,.2)',s:'#f0c95a',n:'🪙',t:'Монеты ×2'},{x:W*.82,y:H*.76,r:q,c:'rgba(230,70,50,.25)',s:'#ff7a59',n:'🔥',t:'Лава: ×4, урон'}];
 P.x=Math.min(P.x,W-14);P.y=Math.min(P.y,H-14);coins=coins.filter(c=>c.x<W&&c.y<H);en=en.filter(e=>e.x<W+60&&e.y<H+60)}
new ResizeObserver(fit).observe(cv);addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();
const pad=document.getElementById('pad'),knob=document.getElementById('knob');
function padMove(e){if(!joy)return;let x=e.clientX-joy.sx,y=e.clientY-joy.sy;const l=Math.hypot(x,y);if(l>45){x*=45/l;y*=45/l}joy.x=joy.sx+x;joy.y=joy.sy+y;knob.style.transform='translate('+x+'px,'+y+'px)'}
pad.addEventListener('pointerdown',e=>{const r=pad.getBoundingClientRect();joy={sx:r.left+r.width/2,sy:r.top+r.height/2,x:0,y:0};pad.setPointerCapture(e.pointerId);padMove(e)});
pad.addEventListener('pointermove',padMove);
['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>{joy=null;knob.style.transform=''}));


const TH=[['#14302f','#1d4340'],['#2b2a1a','#3d3b24'],['#2a1d33','#3b2a48'],['#1b2a3d','#27405c'],['#3a1c1c','#552a2a']],BO=['👹','🐲','💀','👽','🤖'],EN=['👾','🐛','🦇','👻','🕷️'];
const near=(o,x,y)=>Math.hypot(o.x-x,o.y-y);
TH.push(['#1f2a1f','#2f3f2f'],['#2a2a2a','#3d3d3d'],['#2d1a28','#4a2a42'],['#102a30','#1a4550'],['#2a0d0d','#4a1515']);
BO.push('🦖','🐙','😈','☠️','👁️');EN.push('🐍','🦂','🧟','👺','🦑');
let pa=[],fl=[],lastB=0,AC=null,shk=0,sLv=1,S={q:2,dmg:1,snd:1,vib:1};
function lvS(d){sLv=Math.max(1,Math.min(20,sLv+d));document.getElementById('sl').textContent=sLv}
try{Object.assign(S,JSON.parse(localStorage.getItem('set2')||'{}'))}catch(e){}
const NM={dmg:'Цифры урона',snd:'Звук',vib:'Вибрация'};
function tb(){const qb=document.getElementById('t_q');if(qb)qb.textContent='Графика: '+['Низкая','Средняя','Высокая','Ультра'][S.q];for(const k in NM){const b=document.getElementById('t_'+k);if(b)b.textContent=NM[k]+': '+(S[k]?'вкл':'выкл')}}
function tg(k){S[k]=S[k]?0:1;try{localStorage.setItem('set2',JSON.stringify(S))}catch(e){}tb();if(k==='snd'&&S.snd)beep(660,.08)}
tb();
function cq(){S.q=(S.q+1)%4;try{localStorage.setItem('set2',JSON.stringify(S))}catch(e){}tb()}
function beep(f,d,v){if(!S.snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.value=f;gn.gain.value=v||.04;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function fxp(x,y,c,n){if(S.q<1)return;n=Math.round(n*(S.q===1?.5:S.q===3?1.6:1));for(let i=0;i<n&&pa.length<(S.q===3?500:300);i++){const a=Math.random()*6.2832,v=40+Math.random()*120,l=.4+Math.random()*.4;pa.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l,m:l,c})}}
function dn(e,a){if(S.dmg&&fl.length<40)fl.push({x:e.x+(Math.random()-.5)*14,y:e.y-e.r,t:Math.round(a),l:.7})}
function kill(e){fxp(e.x,e.y,'#8be08b',10);beep(200+Math.random()*60,.08,.04)}
function pk(c){fxp(c.x,c.y,'#ffd84a',4);const t=performance.now();if(t-lastB>60){lastB=t;beep(880+Math.random()*200,.06,.03)}}
function hurt(){fxp(P.x,P.y,'#ff5a5a',8);if(S.q>=3)shk=.3;beep(160,.12,.06);if(S.vib&&navigator.vibrate)try{navigator.vibrate(30)}catch(e){}}
function drawHero(x,y){const r=15,gr=g.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);gr.addColorStop(0,'#ffec70');gr.addColorStop(1,'#e6b523');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
 g.fillStyle='#111';for(const s of[-1,1]){g.beginPath();g.ellipse(x+s*r*.34,y-r*.2,r*.12,r*.23,0,0,7);g.fill()}
 g.strokeStyle='#111';g.lineWidth=r*.13;g.lineCap='round';g.beginPath();g.arc(x,y-r*.12,r*.62,.17*Math.PI,.83*Math.PI);g.stroke();g.lineCap='butt'}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,Math.max(0,w),h,r);else g.rect(x,y,Math.max(0,w),h)}
function shd(x,y,r){if(S.q<1)return;g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y,r,r*.4,0,0,7);g.fill()}
function spawnBoss(){const m=Math.round((250+110*Math.pow(bossLv,1.7))*D.h);boss={x:W-50,y:50,hp:m,m:m,r:24+bossLv*1.5,t:2.5};bt=120;beep(110,.5,.08);say('Босс '+bossLv+' появился!')}
const MAXL=20;
TH.push(['#2a2415','#40371f'],['#152a2a','#1f4040'],['#2a152a','#401f40'],['#15152a','#1f1f40'],['#2a1515','#401f1f'],['#222222','#333333'],['#1a2a15','#284020'],['#2a2015','#403020'],['#15202a','#203040'],['#300a0a','#5a1212']);
BO.push('🧛','🐺','🦈','🧌','🛸','🦅','🐻','🎃','🦂','👿');EN.push('🦠','🐀','🐊','🦎','🐝','🦟','🪲','🐸','🐗','🦍');
function mk(x,y){const h=Math.round((6+bossLv*5)*D.h);en.push({x,y,hp:h,m:h,r:12})}
const oc=()=>Math.round(150*Math.pow(1.5,orb));
function win(){paused=true;document.getElementById('mt').textContent='Победа! Ты прошёл все '+MAXL+' уровней. Выбери сложность снова';menu.style.display='flex'}
const WE=['🏏','🗡️','🏹','🪄','🔫'],DF=[{h:.6,d:.6,s:3,c:1.5},{h:1,d:1,s:4,c:1},{h:1.6,d:1.5,s:5,c:.8},{h:2.4,d:2.2,s:6,c:.65},{h:3.5,d:3.2,s:7,c:.5}],menu=document.getElementById('menu');
let D=DF[1],paused=true,mag=false,x2=false,orb=0,oa=0;
function start(i){D=DF[i];up={spd:0,hp:0,dmg:0};mag=false;x2=false;orb=0;document.getElementById('mt').textContent='Выбери сложность';wi=0;money=(sLv-1)*80;bossLv=sLv;coins=[];msgT=0;reset();lastKey='';paused=false;menu.style.display='none'}
function drop(x,y,n){for(let i=0;i<n;i++)coins.push({x:x+(Math.random()-.5)*30,y:y+(Math.random()-.5)*30})}
function update(dt){
 let dx=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0),dy=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0);
 if(joy){const jx=joy.x-joy.sx,jy=joy.y-joy.sy,l=Math.hypot(jx,jy);if(l>8){const m=Math.pow(Math.min(1,l/45),1/SENS);dx=jx/l*m;dy=jy/l*m}}
 const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}if(l>.1)P.a=Math.atan2(dy,dx);idle=l>.1?0:idle+dt;
 P.x=Math.max(14,Math.min(W-14,P.x+dx*spd()*dt));P.y=Math.max(14,Math.min(H-14,P.y+dy*spd()*dt));
 P.inv-=dt;P.cd-=dt;flash-=dt;msgT-=dt;if(zin(P,0))P.hp=Math.min(maxHp(),P.hp+8*dt);if(zin(P,2))P.hp-=(4+bossLv)*D.d*dt;if(P.x<=15||P.x>=W-15||P.y<=15||P.y>=H-15)P.hp-=(4+bossLv)*D.d*dt;
 if(!boss){bt-=dt;if(bt<=0)spawnBoss()}
 tc+=dt;if(tc>.9){tc=0;if(coins.length<20){const q=Math.random(),z=q<.35?ZN[1]:q<.55?ZN[2]:null;coins.push(z?{x:z.x+(Math.random()-.5)*z.r*1.3,y:z.y+(Math.random()-.5)*z.r*1.3}:{x:30+Math.random()*(W-60),y:30+Math.random()*(H-60)})}}
 ts+=dt;if(ts>3&&en.length<D.s+bossLv){ts=0;const a=Math.random()*6.28;en.push({x:W/2+Math.cos(a)*(W/2+30),y:H/2+Math.sin(a)*(H/2+30),hp:Math.round((6+bossLv*5)*D.h),m:Math.round((6+bossLv*5)*D.h),r:12})}
 if(mag)for(const c of coins){const d=near(c,P.x,P.y);if(d<150&&d>1){c.x+=(P.x-c.x)/d*260*dt;c.y+=(P.y-c.y)/d*260*dt}}
 coins=coins.filter(c=>near(c,P.x,P.y)>34||(money+=bossLv*(zin(c,1)?2:zin(c,2)?4:1),pk(c),false));
 const all=boss?[...en,boss]:en;
 for(const e of en){const d=near(e,P.x,P.y)||1;e.x+=(P.x-e.x)/d*(45+bossLv*3)*dt;e.y+=(P.y-e.y)/d*(45+bossLv*3)*dt;hit(e,d,(4+bossLv*1.2)*D.d)}
